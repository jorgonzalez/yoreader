# Publishes the laptop page (web/) with GitHub Pages after each change on main.
# The repository's Pages source must be set to "GitHub Actions".
name: Laptop page

on:
  push:
    branches: [main]
    paths: ["web/**", "sync/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the sync logic
        run: node --test web/test/*.test.js
      - name: Page files only (no tests)
        run: mkdir -p _site && cp web/index.html web/app.js web/sync.js web/style.css web/icon.svg _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
